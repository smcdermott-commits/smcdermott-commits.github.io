<div class="youtube-container" style="--max-width: {{ include.width | default: '315px' }}">
    <div class="youtube-aspect-ratio">
        <iframe
            src="https://www.youtube.com/embed/{{ include.id }}?autoplay=1&mute=1&loop=1&playlist={{ include.id }}&playsinline=1"
            title="YouTube Shorts video"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>
    </div>
</div>
